spring:
  datasource:
    url: ${COMMUNITY_DB_URL:jdbc:postgresql://localhost:5432/tripplanner}
    username: ${COMMUNITY_DB_USERNAME:tripplanner}
    password: ${COMMUNITY_DB_PASSWORD:tripplanner}
  jpa:
    database: POSTGRESQL
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_schema: social
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas:
      - social
      - notif
      - media
    default-schema: social
    create-schemas: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m
  servlet:
    multipart:
      max-file-size: ${COMMUNITY_MAX_FILE_SIZE:10MB}
      max-request-size: ${COMMUNITY_MAX_REQUEST_SIZE:12MB}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: community-service
      auto-offset-reset: earliest
    producer:
      acks: all
  cloud:
    bus:
      destination: navio-config-bus
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

eureka:
  client:
    refresh:
      enable: false
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7

server:
  port: ${COMMUNITY_SERVICE_PORT:8084}

navio:
  community:
    media:
      storage-path: ${COMMUNITY_MEDIA_STORAGE_PATH:./data/community-media}
