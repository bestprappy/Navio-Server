spring:
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://postgres:5432/tripplanner}
    username: ${USER_DB_USERNAME:tripplanner}
    # No default. A committed fallback password becomes the production password
    # on the day someone forgets to set the variable.
    password: ${USER_DB_PASSWORD}
  jpa:
    database: POSTGRESQL
    show-sql: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks the mapping matches.
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    schemas: iam
    default-schema: iam
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: user-management-service
      auto-offset-reset: earliest
    producer:
      acks: all

navio:
  security:
    keycloak:
      issuer-uri: ${KEYCLOAK_ISSUER_URI}
      audiences: ${KEYCLOAK_AUDIENCES:navio-api}
      admin:
        base-url: ${KEYCLOAK_BASE_URL}
        realm: ${KEYCLOAK_REALM:navio}
        client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:navio-user-management}
        client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7

server:
  port: 8081
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

app:
  message: "User Management Service"
