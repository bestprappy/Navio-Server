spring:
  application:
    name: api-gateway
  cloud:
    bus:
      destination: navio-config-bus
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
          globalcors:
            corsConfigurations:
              '[/**]':
                # Explicit origins only. A wildcard here combined with
                # allowCredentials would let any site issue credentialed
                # cross-origin calls on a signed-in user's behalf.
                allowedOrigins: ${NAVIO_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                # Enumerated rather than "*": the wildcard is invalid alongside
                # allowCredentials per the CORS spec, and listing headers keeps
                # the preflight contract explicit.
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Accept
                  - Accept-Language
                  - X-Requested-With
                allowCredentials: true
                maxAge: 3600
          routes:
            - id: trip-planning-service
              uri: lb://trip-planning-service
              predicates:
                - Path=/v1/trips/**,/v1/public-trips/**,/v1/share/**
            - id: user-management-service
              uri: lb://user-management-service
              predicates:
                - Path=/v1/users/**,/v1/admin/users/**
            - id: mobility-and-ev-service
              uri: lb://mobility-and-ev-service
              predicates:
                - Path=/v1/places/**,/v1/routes/**,/v1/geo/**,/v1/ev/**,/v1/chargers/**,/v1/admin/ev/**
            - id: community-service
              uri: lb://community-service
              predicates:
                - Path=/v1/community/**,/v1/groups/**,/v1/posts/**,/v1/feed/**,/v1/notifications/**,/v1/media/**

navio:
  security:
    keycloak:
      # The gateway is the trust boundary: it validates every token here before
      # IdentityPropagationFilter derives the X-User-Id header that downstream
      # services consume. That header is stripped from inbound requests first,
      # so a client can no longer forge it.
      issuer-uri: ${KEYCLOAK_ISSUER_URI}
      audiences: ${KEYCLOAK_AUDIENCES:navio-api}
      clock-skew: 30s

eureka:
  client:
    refresh:
      enable: false
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7

server:
  port: 8080
