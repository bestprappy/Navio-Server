spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tripplanner
    username: tripplanner
    password: tripplanner
  jpa:
    database: POSTGRESQL
    show-sql: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: trip
    default-schema: trip
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: trip-planning-service
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        # Fail a send in seconds when the broker is down; the outbox retries later.
        max.block.ms: 10000
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
  cloud:
    bus:
      destination: navio-config-bus
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
  cache:
    cache-names: currencyRates
    caffeine:
      spec: maximumSize=32,expireAfterWrite=12h,recordStats

navio:
  outbox:
    # trip.events.v1 transactional outbox: SharedPlanListed.v1 for follower notifications.
    topic: trip.events.v1
    retention: P14D
    relay:
      enabled: ${TRIP_OUTBOX_RELAY_ENABLED:true}
      interval-ms: 2000
  currency-provider:
    base-url: ${CURRENCY_PROVIDER_BASE_URL:https://api.frankfurter.dev}
  mobility:
    base-url: ${MOBILITY_SERVICE_BASE_URL:http://localhost:8083}

eureka:
  client:
    refresh:
      enable: false
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7

server:
  port: 8082

app:
  message: "Hello Reference"
